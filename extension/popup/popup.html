<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Live Tab Transcription</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <h1>Live Tab Transcription</h1>
      <div class="status-row">
        <span id="listening-dot" class="dot"></span>
        <span id="status-badge" class="status-badge status-disconnected">Disconnected</span>
      </div>
    </header>

    <div id="info-banner" class="info-banner" hidden></div>

    <div class="controls">
      <label for="language-select">Language</label>
      <select id="language-select">
        <option value="en">English</option>
        <option value="es">Spanish</option>
        <option value="fr">French</option>
        <option value="de">German</option>
        <option value="pt">Portuguese</option>
        <option value="multi">Multilingual (auto)</option>
      </select>
    </div>

    <div class="buttons">
      <button id="start-btn" class="btn btn-primary">Start Transcription</button>
      <button id="stop-btn" class="btn btn-secondary" disabled>Stop</button>
    </div>

    <div class="transcript-container">
      <div id="final-transcript" class="transcript final"></div>
      <div id="interim-transcript" class="transcript interim"></div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
